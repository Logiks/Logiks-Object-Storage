services:
  object-storage:
    build: .
    container_name: logiks-object-storage
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      STORAGE_ROOT: /data/objects
      TMP_ROOT: /data/tmp
      DB_PATH: /data/metadata.db
      PUBLIC_BASE_URL: http://localhost:8080
      STORAGE_API_KEY: change-me
      PRESIGN_SECRET: change-this-to-a-long-random-secret
      MAX_OBJECT_SIZE: 107374182400
    volumes:
      - ./data:/data
    restart: unless-stopped
