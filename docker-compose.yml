services:
  object-storage:
    build: .
    container_name: logiks-object-storage
    ports:
      - "8080:8080"
    environment:
      PORT: ${PORT:-8080}
      TMP_ROOT: ${TMP_ROOT:-/data/tmp}
      DB_PATH: ${DB_PATH:-/data/metadata.db}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      STORAGE_API_KEY: ${STORAGE_API_KEY:-change-me}
      PRESIGN_SECRET: ${PRESIGN_SECRET:-change-this-to-a-long-random-secret}
      MAX_OBJECT_SIZE: ${MAX_OBJECT_SIZE:-107374182400}
      # Which backend holds the object bytes. See .env.example for the full
      # set of backend-specific vars (S3_*, AZURE_*, SFTP_*) — set whichever
      # ones your chosen backend needs in your .env file; unused ones are
      # simply ignored.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-filesystem}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/objects}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PREFIX: ${S3_PREFIX:-}
      AZURE_CONTAINER: ${AZURE_CONTAINER:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY:-}
      AZURE_PREFIX: ${AZURE_PREFIX:-}
      SFTP_HOST: ${SFTP_HOST:-}
      SFTP_PORT: ${SFTP_PORT:-}
      SFTP_USERNAME: ${SFTP_USERNAME:-}
      SFTP_PASSWORD: ${SFTP_PASSWORD:-}
      SFTP_PRIVATE_KEY: ${SFTP_PRIVATE_KEY:-}
      SFTP_PASSPHRASE: ${SFTP_PASSPHRASE:-}
      SFTP_BASE_PATH: ${SFTP_BASE_PATH:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
